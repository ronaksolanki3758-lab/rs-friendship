
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RS Friendship Login</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff9e9;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.box{
  background:white;
  padding:30px;
  width:90%;
  max-width:400px;
  border-radius:20px;
  box-shadow:0 5px 25px #0002;
  text-align:center;
}
h1{color:#bd8b19}
input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
}
button{
  width:100%;
  padding:14px;
  background:#c79520;
  color:white;
  border:0;
  border-radius:10px;
  font-size:17px;
  margin-top:12px;
}
a{color:#bd8b19}
</style>
</head>
<body>
<div class="box">
<h1>👑 RS Friendship</h1>
<h2>Welcome Back!</h2>
<p>Login to connect with friends</p>

<form onsubmit="login(event)">
<input type="email" id="email" placeholder="Email Address" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>

<p>Don't have an account?</p>
<a href="signup.html">Create New Account</a>
<br><br>
<a href="index.html">Back to Home</a>
</div>

<script>
function login(e){
 e.preventDefault();
 alert("Login demo successful! Connect a secure authentication service to enable real accounts.");
}
</script>
</body>
</html>
